<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>CRAZY FUNNY WORLD</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>
  <div id="game"></div>

  <div id="topBar">
    <div id="gameTitle">CRAZY FUNNY WORLD</div>
    <div id="score">⭐ 0</div>
  </div>

  <div id="status">Loading your world...</div>

  <div id="controls">
    <div id="joystick">
      <div id="stick"></div>
    </div>

    <div id="actionButtons">
      <button id="jump">JUMP</button>
      <button id="dance">DANCE</button>
      <button id="random">😂 FUNNY</button>
    </div>
  </div>

  <div id="startScreen">
    <div class="startCard">
      <h1>CRAZY FUNNY WORLD</h1>
      <p>Welcome to your crazy 3D adventure!</p>
      <p>Explore, jump, dance and collect stars.</p>
      <button id="start">START GAME</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
